[project]
name = "facility-monitor"
version = "0.1.0"
description = "POC: people counting/tracking + lights on/off monitoring with YOLO and a live dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.2.2",
    "torchvision==0.17.2",
    "numpy>=1.26,<2",
    "ultralytics>=8.3",
    "opencv-python-headless>=4.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "scipy>=1.11",
    "lap>=0.5",
]

[tool.uv]
package = false
